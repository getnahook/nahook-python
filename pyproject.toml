[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nahook"
version = "0.1.2"
description = "Official Python SDK for the Nahook webhook platform"
readme = "README.md"
license = "MIT"
authors = [{ name = "Nahook", email = "support@nahook.com" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.24.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-httpx>=0.30.0", "hypothesis>=6.0"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*.test.py"]
addopts = "--import-mode=importlib"

[project.urls]
Homepage = "https://nahook.com"
Documentation = "https://docs.nahook.com"
Repository = "https://github.com/getnahook/nahook-python"
